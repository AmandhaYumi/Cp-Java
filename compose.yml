services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mercadoexpress
      POSTGRES_USER: mercadoexpress
      POSTGRES_PASSWORD: mercadoexpress
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadoexpress"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mercadoexpress
      RABBITMQ_DEFAULT_PASS: mercadoexpress
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      banco-tranquilo:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/mercadoexpress
      DATABASE_USERNAME: mercadoexpress
      DATABASE_PASSWORD: mercadoexpress
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: mercadoexpress
      RABBITMQ_PASSWORD: mercadoexpress
      MESSAGING_ENABLED: "true"
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      BANK_API_URL: http://banco-tranquilo:9090/api/banco-tranquilo
    ports:
      - "8080:8080"

  banco-tranquilo:
    build: ./banco-tranquilo
    ports:
      - "9090:9090"

volumes:
  postgres_data:
