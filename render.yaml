services:
  - type: web
    name: mercado-express-cp5
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: mercado-express-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: mercado-express-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mercado-express-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mercado-express-db
          property: password
      - key: MESSAGING_ENABLED
        value: "true"
      - key: BANK_API_URL
        value: http://localhost:10000/api/banco-tranquilo
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_SSL
        value: "true"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false

databases:
  - name: mercado-express-db
    plan: free
    databaseName: mercadoexpress
    user: mercadoexpress
