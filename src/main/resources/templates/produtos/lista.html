<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos · Mercadinho</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: alerts}"></div><div class="page-head"><div><span class="eyebrow">Catálogo</span><h1>Produtos</h1></div><a class="button primary" th:href="@{/products/new}" sec:authorize="hasRole('GERENTE')">Novo produto</a></div>
<form class="search" method="get"><input name="search" th:value="${search}" placeholder="Buscar por nome ou categoria"><button class="button dark">Buscar</button></form>
<section class="product-grid"><article class="product-card" th:each="product : ${products}"><div class="product-top"><span class="tag" th:text="${product.category}">Categoria</span><span class="stock" th:text="${product.stock + ' em estoque'}">0</span></div><h2 th:text="${product.name}">Produto</h2><p th:text="${product.description}">Descrição</p><div class="product-bottom"><strong th:text="${#numbers.formatCurrency(product.price)}">R$ 0</strong><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><input type="hidden" name="quantity" value="1"><button class="button primary" th:disabled="${product.stock == 0}">Adicionar</button></form></div><div class="admin-actions" sec:authorize="hasRole('GERENTE')"><a th:href="@{/products/{id}/edit(id=${product.id})}">Editar</a><form th:action="@{/products/{id}/delete(id=${product.id})}" method="post"><button class="link-danger" onclick="return confirm('Remover este produto?')">Excluir</button></form></div></article></section><div class="empty" th:if="${#lists.isEmpty(products)}">Nenhum produto encontrado.</div></main><footer>Mercadinho</footer></body></html>
