<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto · Mercadinho</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container narrow"><div class="page-head"><div><span class="eyebrow">Gestão de catálogo</span><h1 th:text="${product.id == null ? 'Novo produto' : 'Editar produto'}">Produto</h1></div></div><form class="panel form" th:object="${product}" th:action="${product.id == null ? '/products' : '/products/' + product.id}" method="post"><div class="two-cols"><label>Nome<input th:field="*{name}" required></label><label>Categoria<input th:field="*{category}" required></label></div><small class="field-error" th:errors="*{name}"></small><label>Descrição<textarea th:field="*{description}" rows="4"></textarea></label><div class="three-cols"><label>Preço de venda<input th:field="*{price}" type="number" step="0.01" min="0.01" required></label><label>Custo<input th:field="*{costPrice}" type="number" step="0.01" min="0" required></label><label>Estoque<input th:field="*{stock}" type="number" min="0" required></label></div><label class="check"><input th:field="*{active}" type="checkbox"> Produto ativo</label><div class="actions"><button class="button primary">Salvar produto</button><a class="button ghost" th:href="@{/products}">Cancelar</a></div></form></main></body></html>
