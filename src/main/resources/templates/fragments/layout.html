<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark">M</span><span>Mercado<strong>Express</strong></span></a>
    <nav>
        <a th:href="@{/products}" sec:authorize="isAuthenticated()">Produtos</a>
        <a th:href="@{/cart}" sec:authorize="isAuthenticated()">Carrinho</a>
        <a th:href="@{/purchases}" sec:authorize="isAuthenticated()">Compras</a>
        <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('GERENTE')">Dashboard</a>
        <a th:href="@{/login}" sec:authorize="isAnonymous()">Entrar</a>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()"><button class="nav-button">Sair</button></form>
    </nav>
</header>
<div th:fragment="alerts">
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
