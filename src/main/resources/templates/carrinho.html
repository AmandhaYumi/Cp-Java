<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho · Mercadinho</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: alerts}"></div><div class="page-head"><div><span class="eyebrow">Seu pedido</span><h1>Carrinho</h1></div></div><div class="checkout-grid"><section class="panel"><div class="cart-line" th:each="line : ${lines}"><div><strong th:text="${line.product.name}">Produto</strong><small th:text="${line.quantity + ' × ' + #numbers.formatCurrency(line.product.price)}"></small></div><div class="line-end"><b th:text="${#numbers.formatCurrency(line.subtotal)}">R$ 0</b><form th:action="@{/cart/remove/{id}(id=${line.product.id})}" method="post"><button class="link-danger">Remover</button></form></div></div><div class="empty" th:if="${#lists.isEmpty(lines)}">Seu carrinho está vazio. <a th:href="@{/products}">Escolher produtos</a></div><div class="total" th:unless="${#lists.isEmpty(lines)}"><span>Total</span><strong th:text="${#numbers.formatCurrency(total)}">R$ 0</strong></div></section><aside class="panel" th:unless="${#lists.isEmpty(lines)}"><h2>Pagamento</h2><p class="muted">Use <b>0000</b> no final do cartão para simular recusa.</p><form th:action="@{/cart/checkout}" method="post" class="form"><label>Nome no cartão<input name="cardHolder" required placeholder="NOME COMPLETO"></label><label>Número do cartão<input name="cardNumber" required minlength="13" maxlength="19" placeholder="4111 1111 1111 1111"></label><button class="button primary full">Finalizar compra</button></form></aside></div></main></body></html>
