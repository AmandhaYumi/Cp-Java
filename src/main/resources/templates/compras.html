<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compras · Mercadinho</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: alerts}"></div><div class="page-head"><div><span class="eyebrow">Histórico</span><h1>Minhas compras</h1></div></div><section class="panel table-wrap"><table><thead><tr><th>Pedido</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th><th>Transação</th></tr></thead><tbody><tr th:each="purchase : ${purchases}"><td th:text="${'#' + purchase.id}"></td><td th:text="${#temporals.format(purchase.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${purchase.items.size()}"></td><td th:text="${#numbers.formatCurrency(purchase.total)}"></td><td><span class="status" th:classappend="${purchase.status.name().toLowerCase()}" th:text="${purchase.status}"></span></td><td class="mono" th:text="${purchase.bankTransactionId ?: 'Processando'}"></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(purchases)}">Você ainda não fez compras.</div></section></main></body></html>
