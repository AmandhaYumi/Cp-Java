<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro · Mercadinho</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head>
<body class="auth-page"><a class="brand auth-brand" th:href="@{/}"><span class="brand-mark">M</span><span>Mercadinho</span></a><main class="auth-shell"><section class="auth-copy"><span class="eyebrow">Comece agora</span><h1>Faça seu cadastro</h1><p>Crie uma conta para comprar e consultar seus pedidos.</p></section><section class="auth-card"><h2>Criar conta</h2><div class="alert error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" th:object="${form}" method="post" class="form"><label>Nome<input th:field="*{name}" required placeholder="Seu nome"></label><small class="field-error" th:errors="*{name}"></small><label>E-mail<input th:field="*{email}" type="email" required placeholder="voce@email.com"></label><small class="field-error" th:errors="*{email}"></small><label>Senha<input th:field="*{password}" type="password" required minlength="8" placeholder="Mínimo de 8 caracteres"></label><small class="field-error" th:errors="*{password}"></small><button class="button primary full">Cadastrar</button></form><p class="center muted">Já possui conta? <a th:href="@{/login}">Entrar</a></p></section></main></body></html>
