<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Mercado Express</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div class="page-head"><div><span class="eyebrow">Visão gerencial</span><h1>Operação em números.</h1></div><span class="live"><i></i> Atualizado agora</span></div><section class="kpis"><article><small>Vendas aprovadas</small><strong th:text="${dashboard.orders}">0</strong></article><article><small>Receita</small><strong th:text="${#numbers.formatCurrency(dashboard.revenue)}">R$ 0</strong></article><article><small>Lucro</small><strong th:text="${#numbers.formatCurrency(dashboard.profit)}">R$ 0</strong></article><article><small>Itens em estoque</small><strong th:text="${dashboard.stock}">0</strong></article><article><small>E-mails enviados</small><strong th:text="${dashboard.sentEmails}">0</strong></article></section><div class="dashboard-grid"><section class="panel"><h2>Vendas por categoria</h2><div class="bars" th:if="${!#lists.isEmpty(dashboard.categories)}"><div class="bar-row" th:each="stat : ${dashboard.categories}"><div><span th:text="${stat.category}"></span><b th:text="${#numbers.formatCurrency(stat.revenue)}"></b></div><div class="bar-track"><i th:style="${'width:' + stat.percent + '%'}"></i></div></div></div><div class="empty" th:if="${#lists.isEmpty(dashboard.categories)}">Finalize uma compra para alimentar o gráfico.</div></section><section class="panel"><h2>Compras recentes</h2><div class="recent" th:each="purchase : ${dashboard.recent}"><div><strong th:text="${'#' + purchase.id + ' · ' + purchase.customer.name}"></strong><small th:text="${#temporals.format(purchase.createdAt, 'dd/MM HH:mm')}"></small></div><div><b th:text="${#numbers.formatCurrency(purchase.total)}"></b><span class="status" th:classappend="${purchase.status.name().toLowerCase()}" th:text="${purchase.status}"></span></div></div><div class="empty" th:if="${#lists.isEmpty(dashboard.recent)}">Sem compras registradas.</div></section></div></main></body></html>
