<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Mercado Express</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><a class="brand auth-brand" th:href="@{/}"><span class="brand-mark">M</span><span>Mercado<strong>Express</strong></span></a>
<main class="auth-shell"><section class="auth-copy"><span class="eyebrow">Área segura</span><h1>Bem-vindo de volta.</h1><p>Entre para comprar, acompanhar pagamentos e consultar seu histórico.</p></section>
<section class="auth-card"><h2>Entrar</h2><p class="muted">Use seu e-mail e senha.</p><div class="alert error" th:if="${param.error}">E-mail ou senha inválidos.</div><div class="alert success" th:if="${param.registered}">Cadastro concluído. Faça seu login.</div><div class="alert success" th:if="${param.logout}">Sessão encerrada.</div>
<form th:action="@{/login}" method="post" class="form"><label>E-mail<input type="email" name="email" autocomplete="email" required placeholder="voce@email.com"></label><label>Senha<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="button primary full">Entrar</button></form><p class="center muted">Ainda não tem conta? <a th:href="@{/register}">Cadastre-se</a></p></section></main></body></html>
